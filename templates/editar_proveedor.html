{% extends 'base.html' %}
{% block title %}Editar Proveedor — SmartGastro{% endblock %}
{% block content %}
<h2>Editar Proveedor</h2>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" value="{{ proveedor.nombre }}" required>
        </div>
        <div class="form-group">
            <label>Teléfono</label>
            <input type="text" name="telefono" value="{{ proveedor.telefono or '' }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ proveedor.email or '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{{ url_for('proveedores.index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
